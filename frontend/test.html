<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Button</title>
</head>
<body>
 
  <button id="debugButton" type="button">Debug</button>
  <script>
    const formData = new FormData();
    formData.append('model_name', 'DL');

    document.getElementById('debugButton').addEventListener('click', async (event) => {
      event.preventDefault(); // Ngăn chặn hành vi mặc định của button
      try {
        console.log(1);
        const response = await fetch('http://0.0.0.0:8000/modeling/', {
          method: 'POST',
          body: formData, // Không cần thêm Content-Type header
        });

        console.log('Response:', response);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();console.log('Debug button clicked');
        console.log('Result:', result);
      } catch (error) {
        console.error('Error:', error);
      }
    });
  </script>
</body>
</html>
